        - generic [ref=e225]:
          - heading "Execution rules (always applied)" [level=4] [ref=e226]
          - list [ref=e227]:
            - listitem [ref=e228]: Signals are evaluated on the close of confirmed bars only; orders become active on the next bar. Nothing fills on the signal bar.
            - listitem [ref=e229]: Market orders fill at the next bar's open (ask for buys, bid for sells) plus slippage.
            - listitem [ref=e230]: Limit orders fill at their price; only a gap open through the price fills at the better open.
            - listitem [ref=e231]: Stops gapped through fill at the open (worse than the stop), plus slippage.
            - listitem [ref=e232]: Inside a bar, orders trigger in the order the modelled price path reaches them, so TP1 → stop to breakeven → breakeven hit can all happen in one bar.
            - listitem [ref=e233]: Warm-up bars before the start date feed the indicator but never create trades; only signals inside the window are traded.
            - listitem [ref=e234]: Each strategy is an independent book with its own equity; "Combined" sums their P&L.
