          - heading "Execution rules (always applied)" [level=4] [ref=f7e237]
          - list [ref=f7e238]:
            - listitem [ref=f7e239]: Signals are evaluated on the close of confirmed bars only; orders become active on the next bar. Nothing fills on the signal bar.
            - listitem [ref=f7e240]: Market orders fill at the next bar's open (ask for buys, bid for sells) plus slippage.
            - listitem [ref=f7e241]: Limit orders fill at their price; only a gap open through the price fills at the better open.
            - listitem [ref=f7e242]: Stops gapped through fill at the open (worse than the stop), plus slippage.
            - listitem [ref=f7e243]: Inside a bar, orders trigger in the order the modelled price path reaches them, so TP1 → stop to breakeven → breakeven hit can all happen in one bar.
            - listitem [ref=f7e244]: Warm-up bars before the start date feed the indicator but never create trades; only signals inside the window are traded.
            - listitem [ref=f7e245]: Each strategy is an independent book with its own equity; "Combined" sums their P&L.
